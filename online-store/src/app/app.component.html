<h1>Online Store</h1>

<div class="categories">
  <button 
    (click)="selectCategory(null)" 
    [class.active]="categoryId === null">
    All Products
  </button>

  <button
  *ngFor="let category of categories"
  (click)="selectCategory(category.id)"
  [class.active]="categoryId === category.id">
  {{ category.name }}
</button>
</div>
